services:
  - type: web
    name: apexalgo-24x7-engine
    runtime: node
    plan: free
    rootDir: Trading_App/backend
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/ping
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
