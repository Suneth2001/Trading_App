name: Build & Release iOS (.ipa) and Android (.apk) App Files

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios-ipa-and-release:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Sync iOS
        working-directory: Trading_App/frontend
        run: |
          npm install
          npm run build
          npx cap copy ios

      - name: Build Unsigned iOS App with Xcode
        working-directory: Trading_App/frontend/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package .app into ApexAlgo-v1.0-iOS.ipa
        working-directory: Trading_App/frontend/ios/App
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ApexAlgo-v1.0-iOS.ipa Payload

      - name: Upload iOS .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ApexAlgo-v1.0-iOS-IPA
          path: Trading_App/frontend/ios/App/ApexAlgo-v1.0-iOS.ipa

      - name: Publish downloadable .IPA, .APK & .mobileconfig to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ApexAlgo Pro v1.0 - iPhone (.ipa / .mobileconfig) & Android (.apk)"
          body: |
            ## 📱 ApexAlgo Pro Mobile App Downloads
            - **iPhone (1-Tap Direct iOS App Installer - No PC Needed):** Download and tap `ApexAlgo-iPhone-Installer.mobileconfig` in Safari on your iPhone, then go to **Settings -> Profile Downloaded -> Install**.
            - **iPhone (Native `.ipa` for Sideloadly / AltStore / Scarlet / ESign):** Download `ApexAlgo-v1.0-iOS.ipa`.
            - **Android (`.apk` for Android 6+):** Download `ApexAlgo-v1.0-Android6+.apk`.
          files: |
            Trading_App/frontend/ios/App/ApexAlgo-v1.0-iOS.ipa
            ApexAlgo-v1.0-Android6+.apk
            ApexAlgo-iPhone-Installer.mobileconfig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
